<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 72px 20px; background: #f3f5f9; color: #24304a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 580px; margin: auto; padding: 36px; border: 1px solid #e5e9f2; border-radius: 24px; background: white; box-shadow: 0 16px 50px #24304a0a; }
    .eyebrow { margin: 0 0 10px; color: #6371d9; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -1px; }
    .subtitle { margin: 0 0 28px; color: #7a8497; font-size: 14px; }
    form { display: flex; gap: 10px; }
    input[type="text"] { width: 100%; min-width: 0; padding: 14px 16px; border: 1px solid #dce1ed; border-radius: 12px; background: #fafbfe; font: inherit; }
    button { border: 0; border-radius: 12px; font: inherit; cursor: pointer; }
    .add { flex-shrink: 0; padding: 0 22px; background: #6371d9; color: white; font-weight: 600; }
    .add:hover { background: #505ec5; }
    :focus-visible { outline: 3px solid #9ca7ff; outline-offset: 3px; }
    .summary { margin: 24px 0 12px; font-size: 13px; color: #7a8497; }
    ul { padding: 0; margin: 0; list-style: none; }
    li { display: flex; align-items: center; gap: 12px; padding: 15px 0; border-bottom: 1px solid #edf0f6; }
    li label { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
    input[type="checkbox"] { flex-shrink: 0; width: 19px; height: 19px; margin: 0; accent-color: #6371d9; cursor: pointer; }
    .task-text { overflow-wrap: anywhere; line-height: 1.5; }
    li.completed .task-text { color: #939cad; text-decoration: line-through; }
    .delete { flex-shrink: 0; padding: 7px 10px; background: #fff0f0; color: #c65a64; font-size: 12px; }
    .delete:hover { background: #ffe1e1; }
    .empty { padding: 35px 0 20px; text-align: center; color: #939cad; font-size: 14px; }
    [hidden] { display: none; }
    @media (max-width: 480px) { body { padding: 32px 16px; } main { padding: 26px 20px; } .add { padding: 0 18px; } }
      .account-bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; font-size: 12px; color: #7a8497; }
    .soft-button { padding: 8px 12px; background: #f0f2fc; color: #505ec5; }
    .soft-button:hover { background: #e5e8fa; }
    h1 { overflow-wrap: anywhere; }
    .list-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 24px 0 12px; }
    .list-toolbar .summary { margin: 0; }
    #storage-message { color: #a14652; font-size: 13px; line-height: 1.6; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    dialog { width: calc(100% - 32px); max-width: 420px; padding: 28px; border: 1px solid #e5e9f2; border-radius: 24px; background: white; color: #24304a; box-shadow: 0 16px 50px #24304a20; }
    dialog::backdrop { background: #24304a55; }
    .dialog-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .dialog-heading h2 { margin: 0; font-size: 22px; }
    .auth-form { display: grid; gap: 14px; }
    .auth-form label { display: grid; gap: 7px; font-size: 13px; }
    .auth-form input { width: 100%; min-width: 0; padding: 12px; border: 1px solid #dce1ed; border-radius: 12px; background: #fafbfe; color: #24304a; font: inherit; }
    .auth-form .add { padding: 13px; margin-top: 4px; }
    .auth-note, .auth-switch { font-size: 12px; line-height: 1.8; color: #7a8497; }
    .auth-switch a { color: #505ec5; font-weight: 600; }
    #auth-message { font-size: 13px; line-height: 1.7; color: #505ec5; }
    @media (max-width: 480px) { .auth-form input { font-size: 16px; } }
  </style>
</head>
<body>
  <main>
    <div class="account-bar">
      <span id="account-status">로그인 후 이용해 주세요</span>
      <button type="button" class="soft-button" id="open-login">로그인</button>
      <button type="button" class="soft-button" id="logout" hidden>로그아웃</button>
    </div>
    <p class="eyebrow">ONE THING AT A TIME</p>
    <h1 id="page-title">오늘의 할 일</h1>
    <p class="subtitle">작은 일부터 하나씩, 가볍게 시작해 보세요.</p>
    <form id="task-form">
      <input id="task-input" type="text" aria-label="새로운 할 일" placeholder="어떤 일을 할 예정인가요?" autocomplete="off" maxlength="2000" required>
      <button class="add" type="submit">추가</button>
    </form>
    <div class="list-toolbar">
      <p class="summary" id="summary" role="status" aria-live="polite">전체 0개 · 완료 0개</p>
      <button type="button" class="soft-button" id="reload-tasks" aria-label="할 일 다시 불러오기">새로고침</button>
    </div>
    <ul id="task-list" aria-label="할 일 목록"></ul>
    <p id="storage-message" role="status" hidden></p>
    <p class="empty" id="empty">아직 할 일이 없어요. 첫 할 일을 추가해 보세요.</p>
  </main>
  <dialog id="auth-dialog" aria-labelledby="auth-title" aria-describedby="auth-note">
    <div class="dialog-heading">
      <h2 id="auth-title">로그인</h2>
      <button type="button" class="soft-button" id="close-auth" aria-label="로그인 창 닫기">닫기</button>
    </div>
    <p class="auth-note" id="auth-note"></p>
    <form class="auth-form" id="auth-form">
      <label>이메일<input type="email" id="auth-email" autocomplete="username" maxlength="254" required></label>
      <label id="username-field" hidden>사용자명<input type="text" id="auth-username" autocomplete="nickname" maxlength="30"></label>
      <label>비밀번호<input type="password" id="auth-password" autocomplete="current-password" required></label>
      <button type="submit" class="add" id="auth-submit">로그인</button>
    </form>
    <p id="auth-message" role="status" aria-live="polite"></p>
    <p class="auth-switch"><span id="auth-switch-label">아직 계정이 없나요?</span> <a href="#signup" id="auth-switch">회원가입</a></p>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://xbgjdyqjadwtneoowssm.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_QOaG4X8ET9U9-fkbb8DzZA_tFgj6hu-';
    const APP_URL = 'https://web-builder-test0-16ye9i931-ej-adab.vercel.app/';
    const $ = selector => document.querySelector(selector);
    const form = $('#task-form'), input = $('#task-input'), list = $('#task-list');
    const dialog = $('#auth-dialog'), authForm = $('#auth-form');
    const emailInput = $('#auth-email'), usernameInput = $('#auth-username'), passwordInput = $('#auth-password');
    const authMessage = $('#auth-message'), submitButton = $('#auth-submit');
    let client, user = null, tasks = [], mode = 'login', authBusy = false, taskBusy = false;
    let generation = 0, loadVersion = 0;
    const fields = 'id,text,completed,created_at';

    function message(text = '') {
      $('#storage-message').textContent = text;
      $('#storage-message').hidden = !text;
    }
    function errorText(error) {
      if (error?.code === 'PGRST205' || error?.code === '42P01') return '할 일 테이블이 아직 준비되지 않았어요. Supabase SQL 마이그레이션을 실행해 주세요.';
      if (error?.code === 'email_not_confirmed') return '이메일의 인증 링크를 먼저 확인해 주세요.';
      if (error?.code === 'invalid_credentials') return '이메일 또는 비밀번호를 확인해 주세요.';
      if (error?.code === 'user_already_exists') return '이미 가입한 이메일이에요. 로그인해 주세요.';
      return error?.message || '요청을 처리하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.';
    }
    function controls() {
      input.disabled = !client || !user || taskBusy;
      form.querySelector('button').disabled = input.disabled;
      $('#logout').disabled = authBusy || taskBusy;
      $('#open-login').disabled = !client || authBusy;
    }
    function render() {
      list.replaceChildren();
      for (const task of tasks) {
        const item = document.createElement('li'), label = document.createElement('label');
        const checkbox = document.createElement('input'), text = document.createElement('span'), remove = document.createElement('button');
        checkbox.type = 'checkbox'; checkbox.checked = task.completed; checkbox.disabled = taskBusy;
        item.classList.toggle('completed', task.completed);
        text.className = 'task-text'; text.textContent = task.text;
        remove.type = 'button'; remove.className = 'delete'; remove.textContent = '삭제'; remove.disabled = taskBusy;
        remove.setAttribute('aria-label', `${task.text} 삭제`);
        checkbox.addEventListener('change', () => {
          const completed = checkbox.checked;
          checkbox.checked = task.completed;
          mutate(() => client.from('todos').update({ completed }).eq('id', task.id).eq('user_id', user.id).select(fields).single(),
            data => { tasks = tasks.map(row => row.id === data.id ? data : row); });
        });
        remove.addEventListener('click', () => mutate(
          () => client.from('todos').delete().eq('id', task.id).eq('user_id', user.id).select('id').single(),
          data => { tasks = tasks.filter(row => row.id !== data.id); }));
        label.append(checkbox, text); item.append(label, remove); list.append(item);
      }
      $('#summary').textContent = `전체 ${tasks.length}개 · 완료 ${tasks.filter(task => task.completed).length}개`;
      $('#empty').hidden = tasks.length > 0;
      $('#page-title').textContent = user ? `${user.user_metadata?.username || user.user_metadata?.name || user.email?.split('@')[0] || '사용자'}님의 To-Do List` : '오늘의 할 일';
      $('#account-status').textContent = user ? '로그인됨 · 클라우드 저장' : '로그인 후 이용해 주세요';
      $('#open-login').hidden = !!user; $('#logout').hidden = !user;
      input.placeholder = user ? '어떤 일을 할 예정인가요?' : '로그인하면 나의 할 일을 저장할 수 있어요';
      controls();
    }
    async function loadTasks() {
      const version = ++loadVersion, owner = user?.id, epoch = generation;
      if (!owner) return;
      taskBusy = true; render(); message('할 일을 불러오고 있어요…');
      try {
        const { data, error } = await client.from('todos').select(fields).eq('user_id', owner).order('created_at').order('id');
        if (error) throw error;
        if (version !== loadVersion || epoch !== generation) return;
        tasks = data; message();
      } catch (error) {
        if (version === loadVersion && epoch === generation) message(errorText(error));
      } finally {
        if (version === loadVersion && epoch === generation) { taskBusy = false; render(); }
      }
    }
    async function mutate(request, apply) {
      if (!user || taskBusy) return;
      const epoch = generation;
      taskBusy = true; render(); message();
      try {
        const { data, error } = await request();
        if (error) throw error;
        if (epoch === generation) apply(data);
      } catch (error) { if (epoch === generation) message(errorText(error)); }
      finally { if (epoch === generation) { taskBusy = false; render(); } }
    }
    function acceptSession(session) {
      const next = session?.user || null, changed = user?.id !== next?.id;
      user = next;
      if (changed) {
        generation++; loadVersion++; tasks = []; taskBusy = false; input.value = ''; message();
      }
      render();
      // Auth callbacks remain synchronous; database calls run after the auth lock is released.
      if (changed && user) setTimeout(() => { loadTasks(); }, 0);
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || text.length > 2000) return;
      await mutate(() => client.from('todos').insert({ text, completed: false }).select(fields).single(), data => {
        tasks.push(data); input.value = '';
      });
      if (!input.disabled) input.focus();
    });
    function setMode(next) {
      mode = next;
      const signup = mode === 'signup';
      $('#auth-title').textContent = signup ? '회원가입' : '로그인';
      $('#username-field').hidden = !signup; usernameInput.required = signup;
      passwordInput.minLength = signup ? 8 : 1;
      passwordInput.autocomplete = signup ? 'new-password' : 'current-password';
      passwordInput.value = '';
      submitButton.textContent = signup ? '회원가입' : '로그인';
      $('#auth-switch-label').textContent = signup ? '이미 계정이 있나요?' : '아직 계정이 없나요?';
      $('#auth-switch').textContent = signup ? '로그인' : '회원가입';
      $('#auth-switch').href = signup ? '#login' : '#signup';
      $('#auth-note').textContent = signup ? '나만의 목록을 시작해 보세요. 비밀번호는 8자 이상 입력해 주세요.' : '가입한 이메일로 로그인하고, 어디서든 나의 할 일을 이어가세요.';
      authMessage.textContent = '';
    }
    $('#open-login').addEventListener('click', () => { authForm.reset(); setMode('login'); dialog.showModal(); emailInput.focus(); });
    $('#close-auth').addEventListener('click', () => { if (!authBusy) dialog.close(); });
    dialog.addEventListener('cancel', event => { if (authBusy) event.preventDefault(); });
    dialog.addEventListener('close', () => { passwordInput.value = ''; });
    $('#auth-switch').addEventListener('click', event => { event.preventDefault(); if (!authBusy) setMode(mode === 'login' ? 'signup' : 'login'); });
    authForm.addEventListener('submit', async event => {
      event.preventDefault();
      if (authBusy || !client) return;
      authBusy = true; submitButton.disabled = true; $('#close-auth').disabled = true; controls();
      const email = emailInput.value.trim().toLowerCase(), password = passwordInput.value;
      passwordInput.value = '';
      try {
        authMessage.textContent = '처리 중…';
        if (mode === 'signup') {
          const username = usernameInput.value.trim();
          if (!username || username.length > 30 || password.length < 8) throw new Error('사용자명은 1~30자, 비밀번호는 8자 이상 입력해 주세요.');
          const { data, error } = await client.auth.signUp({ email, password, options: { data: { username }, emailRedirectTo: APP_URL } });
          if (error) throw error;
          if (data.session) { acceptSession(data.session); dialog.close(); }
          else { setMode('login'); authMessage.textContent = '가입 요청을 받았어요. 이메일의 인증 링크를 확인한 뒤 로그인해 주세요. 이미 가입했다면 기존 계정으로 로그인해 주세요.'; }
        } else {
          const { data, error } = await client.auth.signInWithPassword({ email, password });
          if (error) throw error;
          acceptSession(data.session); dialog.close();
        }
      } catch (error) { authMessage.textContent = errorText(error); }
      finally { authBusy = false; submitButton.disabled = false; $('#close-auth').disabled = false; controls(); }
    });
    $('#logout').addEventListener('click', async () => {
      if (authBusy || taskBusy) return;
      authBusy = true; controls();
      try { const { error } = await client.auth.signOut(); if (error) throw error; acceptSession(null); }
      catch (error) { message(errorText(error)); }
      finally { authBusy = false; controls(); }
    });
    $('#reload-tasks').addEventListener('click', () => { if (!taskBusy && user) loadTasks(); });
    async function initialize() {
      render();
      try {
        if (!window.supabase) throw new Error('로그인 모듈을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.');
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        client.auth.onAuthStateChange((_event, session) => { acceptSession(session); });
        const startGeneration = generation;
        const { data, error } = await client.auth.getSession();
        if (error) throw error;
        if (generation === startGeneration) acceptSession(data.session);
      } catch (error) { message(errorText(error)); }
      controls();
    }
    initialize();
  </script>

</body>
</html>
