<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 72px 20px; background: #f3f5f9; color: #24304a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 580px; margin: auto; padding: 36px; border: 1px solid #e5e9f2; border-radius: 24px; background: white; box-shadow: 0 16px 50px #24304a0a; }
    .eyebrow { margin: 0 0 10px; color: #6371d9; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -1px; }
    .subtitle { margin: 0 0 28px; color: #7a8497; font-size: 14px; }
    form { display: flex; gap: 10px; }
    input[type="text"] { width: 100%; min-width: 0; padding: 14px 16px; border: 1px solid #dce1ed; border-radius: 12px; background: #fafbfe; font: inherit; }
    button { border: 0; border-radius: 12px; font: inherit; cursor: pointer; }
    .add { flex-shrink: 0; padding: 0 22px; background: #6371d9; color: white; font-weight: 600; }
    .add:hover { background: #505ec5; }
    :focus-visible { outline: 3px solid #9ca7ff; outline-offset: 3px; }
    .summary { margin: 24px 0 12px; font-size: 13px; color: #7a8497; }
    ul { padding: 0; margin: 0; list-style: none; }
    li { display: flex; align-items: center; gap: 12px; padding: 15px 0; border-bottom: 1px solid #edf0f6; }
    li label { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
    input[type="checkbox"] { flex-shrink: 0; width: 19px; height: 19px; margin: 0; accent-color: #6371d9; cursor: pointer; }
    .task-text { overflow-wrap: anywhere; line-height: 1.5; }
    li.completed .task-text { color: #939cad; text-decoration: line-through; }
    .delete { flex-shrink: 0; padding: 7px 10px; background: #fff0f0; color: #c65a64; font-size: 12px; }
    .delete:hover { background: #ffe1e1; }
    .empty { padding: 35px 0 20px; text-align: center; color: #939cad; font-size: 14px; }
    /* A soft little page for everyday plans. */
    :root { color-scheme: light; --background: #FFF9F9; --accent: #B86B7B; --card: #FFFFFF; --text: #4A3E3D; }
    body { background: var(--background); color: var(--text); padding: 64px 20px 36px; background-image: radial-gradient(circle at 10% 15%, #f9e5e9 0, transparent 27%), radial-gradient(circle at 92% 80%, #f8ece1 0, transparent 28%); }
    main { position: relative; max-width: 620px; padding: 42px; border: 1px solid #f2dfe3; border-radius: 32px; background: var(--card); box-shadow: 0 18px 65px #b86b7b12, 0 4px 12px #b86b7b06; }
    main::before { content: ''; position: absolute; width: 100px; height: 26px; top: -13px; left: calc(50% - 50px); background: #f4dce3b3; transform: rotate(-4deg); border-left: 2px dotted #fff9f9; border-right: 2px dotted #fff9f9; }
    .intro { text-align: center; }
    .flower { display: grid; place-items: center; margin: 0 auto 16px; width: 64px; height: 64px; border-radius: 23px; background: #fff1f4; color: var(--accent); font-size: 42px; transform: rotate(-8deg); }
    .eyebrow { display: inline-block; padding: 6px 12px; margin-bottom: 14px; border-radius: 20px; color: #965264; background: #fff4f6; font-size: 10px; letter-spacing: 1.8px; }
    h1 { font-size: 32px; letter-spacing: -1.5px; }
    .subtitle { margin: 10px 0 30px; color: #816c6a; font-size: 14px; line-height: 1.8; }
    .input-label { display: block; margin-bottom: 10px; font-size: 13px; font-weight: 650; }
    form { gap: 8px; padding: 7px; border: 1px solid #ecd7dc; border-radius: 18px; background: var(--background); }
    input[type="text"] { border: 0; border-radius: 12px; padding: 12px 10px; color: var(--text); background: transparent; font-size: 14px; }
    input[type="text"]::placeholder { color: #957c80; }
    button { transition: background .18s ease, transform .18s ease; }
    .add { padding: 0 20px; border-radius: 13px; background: var(--accent); box-shadow: 0 3px 0 #995365; font-size: 14px; }
    .add:hover { background: #a85b6c; transform: translateY(-1px); }
    .add:active { transform: translateY(1px); }
    :focus-visible { outline: 3px solid #b86b7b; outline-offset: 3px; }
    .list-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 0 14px; }
    .list-heading h2 { margin: 0; font-size: 14px; }
    .summary { margin: 0; padding: 6px 10px; border-radius: 20px; color: #81616a; background: #fff3f5; font-size: 11px; }
    ul { display: grid; gap: 10px; }
    li { padding: 14px; border: 1px solid #f0e1e4; border-radius: 16px; background: var(--card); box-shadow: 0 3px 9px #b86b7b05; }
    li.completed { border-color: #ead3db; }
    input[type="checkbox"] { appearance: none; display: grid; place-content: center; width: 22px; height: 22px; border: 2px solid #d8b5bf; border-radius: 8px; background: white; }
    input[type="checkbox"]::before { content: ''; width: 9px; height: 5px; border-left: 2px solid white; border-bottom: 2px solid white; transform: rotate(-45deg) scale(0); margin-top: -3px; }
    input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
    input[type="checkbox"]:checked::before { transform: rotate(-45deg) scale(1); }
    .task-text { font-size: 14px; }
    li.completed .task-text { color: #947e82; text-decoration-color: #b86b7b; text-decoration-thickness: 1.5px; }
    .delete { border-radius: 9px; background: #fff2f5; color: #985365; }
    .delete:hover { background: #f7dfe6; }
    .empty { margin: 0; padding: 34px 12px; border: 1px dashed #ead2d9; border-radius: 20px; background: #fffafa; color: #816c6a; line-height: 1.9; }
    .empty-icon { display: block; margin-bottom: 9px; color: var(--accent); font-size: 32px; }
    .empty strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 14px; font-weight: 600; }
    .empty small { font-size: 12px; }
    .footer-note { margin: 26px 0 0; text-align: center; color: #8d7378; font-size: 11px; letter-spacing: .3px; }
    [hidden] { display: none; }
    @media (max-width: 480px) { body { padding: 36px 14px; } main { padding: 32px 20px 26px; border-radius: 26px; } h1 { font-size: 28px; } .add { padding: 0 15px; } input[type="text"] { font-size: 16px; } .summary { font-size: 10px; } }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <div class="flower" aria-hidden="true">✿</div>
      <p class="eyebrow">MY LITTLE DAILY LIST</p>
      <h1>오늘의 할 일</h1>
      <p class="subtitle">작은 일 하나, 뿌듯함 한 스푼.<br>오늘도 나만의 속도로 채워가요.</p>
    </header>
    <label class="input-label" for="task-input">오늘은 무엇을 해볼까요?</label>
    <form id="task-form">
      <input id="task-input" type="text" aria-label="새로운 할 일" placeholder="어떤 일을 할 예정인가요?" autocomplete="off" required>
      <button class="add" type="submit"><span aria-hidden="true">＋ </span>추가</button>
    </form>
    <div class="list-heading">
      <h2>나의 작은 계획들 <span aria-hidden="true">♡</span></h2>
      <p class="summary" id="summary" role="status" aria-live="polite">전체 0개 · 완료 0개</p>
    </div>
    <ul id="task-list" aria-label="할 일 목록"></ul>
    <p class="empty" id="empty"><span class="empty-icon" aria-hidden="true">♧</span><strong>새로운 하루, 비워둔 한 페이지</strong><small>첫 번째 할 일을 적어보세요.<br>작은 시작도 충분히 멋져요!</small></p>
    <p class="footer-note">하나씩 해내는 당신을 응원해요 <span aria-hidden="true">♡</span></p>
  </main>
  <script>
    const form = document.querySelector('#task-form');
    const input = document.querySelector('#task-input');
    const list = document.querySelector('#task-list');
    const summary = document.querySelector('#summary');
    const empty = document.querySelector('#empty');

    function updateSummary() {
      const total = list.children.length;
      const completed = list.querySelectorAll('input:checked').length;
      summary.textContent = `전체 ${total}개 · 완료 ${completed}개`;
      empty.hidden = total > 0;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) { input.focus(); return; }

      const item = document.createElement('li');
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      const taskText = document.createElement('span');
      taskText.className = 'task-text';
      taskText.textContent = text;
      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'delete';
      deleteButton.textContent = '삭제';
      deleteButton.setAttribute('aria-label', `${text} 삭제`);

      checkbox.addEventListener('change', () => {
        item.classList.toggle('completed', checkbox.checked);
        updateSummary();
      });
      deleteButton.addEventListener('click', () => {
        item.remove();
        updateSummary();
        input.focus();
      });

      label.append(checkbox, taskText);
      item.append(label, deleteButton);
      list.append(item);
      input.value = '';
      input.focus();
      updateSummary();
    });
  </script>
</body>
</html>
